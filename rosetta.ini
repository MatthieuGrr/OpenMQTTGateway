; Envs de la passerelle de Matthieu (versionné, sans aucun secret)
; Passerelle 433 MHz de Matthieu : ESP32-S3 Super Mini + CC1101 (Ebyte E07-M1101D), brochage RFPocket
[env:esp32s3-supermini-cc1101-rtl_433]
platform = ${com.esp32_platform}
platform_packages = ${com.esp32_platform_packages}
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
extra_scripts =
  pre:scripts/add_mlongcalls.py
  pre:scripts/rosetta_patch_rtl433.py
lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.rc-switch}
  ${libraries.rtl_433_ESP}
  ${libraries.smartrc-cc1101-driver-lib}
build_flags =
  ${com-esp32.build_flags}
  '-DARDUINO_USB_MODE=1'
  '-DARDUINO_USB_CDC_ON_BOOT=1'
  '-DNO_INT_TEMP_READING=true'
  ; Logs série non bloquants : sans lecteur sur le port USB, ils sont perdus au lieu de figer la boucle (et le MQTT)
  '-DSERIAL_TX_TIMEOUT_MS=0'
  '-DvalueAsATopic=true'
  '-DGateway_Name="OMG_CC1101"'
  '-DMQTT_SERVER="192.168.1.29"'
  '-DMQTT_PORT="1883"'
  '-DMQTT_USER="CC1101"'
  ; Secrets locaux (rosetta_secrets.h, ignoré par git) si présents ; absents en CI : valeurs par défaut,
  ; la NVS de l'ESP (identifiants saisis via le portail) reste prioritaire.
  !sh -c 'f="$PWD/rosetta_secrets.h"; [ -f "$f" ] && echo "-include $f" || true'
  '-DCHECK_OTA_UPDATE=false'
  '-DZgatewayRF="RF"'
  '-DZgatewayRTL_433="rtl_433"'
  '-DZradioCC1101="CC1101"'
  '-DPUBLISH_UNPARSED=false'
  '-DSIGNAL_RSSI=true'
  '-DNO_DEAF_WORKAROUND=true'
  '-DRF_CC1101="CC1101"'
  '-DRF_MODULE_CS=12'
  '-DRF_MODULE_GDO0=13'
  '-DRF_MODULE_GDO2=8'
  '-Drtl_433_ReceiverTask_Stack=4096'
  '-DRF_EMITTER_GPIO=13'
  '-DRF_RECEIVER_GPIO=8'
  '-DRF_CC1101_SCK=11'
  '-DRF_CC1101_MISO=9'
  '-DRF_CC1101_MOSI=10'
  '-DRF_CC1101_CS=12'
  '-DRF_NO_RAW=true'
  '-DACTIVE_RECEIVER=3'

; Variante rc-switch seul (sans rtl_433), sans signal brut dans les messages
[env:esp32s3-supermini-cc1101-rf]
extends = env:esp32s3-supermini-cc1101-rtl_433
lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.rc-switch}
  ${libraries.smartrc-cc1101-driver-lib}
build_unflags =
  '-DZgatewayRTL_433="rtl_433"'
  '-DACTIVE_RECEIVER=3'
build_flags =
  ${env:esp32s3-supermini-cc1101-rtl_433.build_flags}

; Passerelle BLE de Matthieu : ESP32-S3 Super Mini seule (LED RGB WS2812 sur GPIO 48)
[env:esp32s3-supermini-ble]
platform = ${com.esp32_platform}
platform_packages = ${com.esp32_platform_packages}
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.ble}
  ${libraries.decoder}
  ${libraries.adafruit_neopixel}
build_flags =
  ${com-esp32.build_flags}
  '-DARDUINO_USB_MODE=1'
  '-DARDUINO_USB_CDC_ON_BOOT=1'
  '-DNO_INT_TEMP_READING=true'
  ; Logs série non bloquants (voir l'env CC1101)
  '-DSERIAL_TX_TIMEOUT_MS=0'
  '-DvalueAsATopic=true'
  '-DGateway_Name="OMG_BLE"'
  '-DMQTT_SERVER="192.168.1.29"'
  '-DMQTT_PORT="1883"'
  '-DMQTT_USER="BLE"'
  !sh -c 'f="$PWD/rosetta_secrets.h"; [ -f "$f" ] && echo "-include $f" || true'
  '-DCHECK_OTA_UPDATE=false'
  '-DZgatewayBT="BT"'
  '-DLED_ADDRESSABLE=true'
  '-DLED_ADDRESSABLE_PIN1=48'
  '-DLED_ADDRESSABLE_NUM=1'
